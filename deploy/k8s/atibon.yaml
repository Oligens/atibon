apiVersion: apps/v1
kind: Deployment
metadata:
  name: atibon
  namespace: atibon
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: atibon }
  template:
    metadata:
      labels: { app: atibon }
    spec:
      serviceAccountName: atibon
      automountServiceAccountToken: false
      containers:
        - name: atibon
          image: ghcr.io/oligens/atibon:3.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: atibon
  namespace: atibon
spec:
  selector: { app: atibon }
  ports: [{ name: https, port: 443, targetPort: 8080 }]
