apiVersion: apps/v1
kind: Deployment
metadata:
  name: atibon-defensive-ai
  namespace: security
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: atibon-defensive-ai}}
  template:
    metadata: {labels: {app: atibon-defensive-ai}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: firewall
        image: ghcr.io/oligens/atibon:defensive-ai-v2
        imagePullPolicy: IfNotPresent
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 2, memory: 2Gi}
        readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
