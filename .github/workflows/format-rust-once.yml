name: ATIBON one-time Rust format

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-once:
    if: contains(github.event.head_commit.message, 'clippy policy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply CI source repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/security/securityInterceptor.ts",
              "originalOpen.call(this, method, url, async, username ?? null, password ?? null);",
              "originalOpen.call(this, method, url, Boolean(async), username ?? null, password ?? null);",
          )
          replace(
              "src/security/securityInterceptor.ts",
              "originalOpen.call(this, method, url, async);",
              "originalOpen.call(this, method, url, Boolean(async));",
          )

          replace(
              "core-rust/src/crypto/transport.rs",
              "!value.is_empty() && value.len() % 2 == 0 && value.bytes().all(|b| b.is_ascii_hexdigit())",
              "!value.is_empty() && value.len().is_multiple_of(2) && value.bytes().all(|b| b.is_ascii_hexdigit())",
          )
          replace(
              "core-rust/src/crypto/transport.rs",
              "if input.len() % 2 != 0 {",
              "if !input.len().is_multiple_of(2) {",
          )

          replace(
              "core-rust/src/egress_privacy.rs",
              "let request_epoch = if policy.rotate_after_requests == 0 {\n        request_count\n    } else {\n        request_count / policy.rotate_after_requests\n    };",
              "let request_epoch = request_count\n        .checked_div(policy.rotate_after_requests)\n        .unwrap_or(request_count);",
          )

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Commit normalized CI fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "CI sources are already repaired and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security/securityInterceptor.ts core-rust
          git commit -m "fix: repair TypeScript and Rust CI checks [skip ci]"
          git pull --rebase origin main
          git push
