name: ATIBON one-time Rust format

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-once:
    if: contains(github.event.head_commit.message, 'clippy policy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply cargo fmt
        run: cargo fmt --all
      - name: Commit normalized Rust formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core-rust
          git commit -m "style: normalize Rust formatting [skip ci]"
          git pull --rebase origin main
          git push
