[package]
name = "defensive_ai_core"
version = "2.0.0"
edition = "2021"

[lib]
name = "defensive_ai_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.7"
parking_lot = "0.12"
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[features]
default = []
