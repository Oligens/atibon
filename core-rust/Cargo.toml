[package]
name = "atibon-core"
version = "3.1.0"
edition = "2021"
description = "ATIBON sovereign defensive firewall core"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "atibon-agent"
path = "src/bin/atibon-agent.rs"

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

# NIST FIPS-203 / FIPS-204 implementations. Kept behind the native-PQC feature so
# minimal deployments can still build the firewall core without pulling PQC code.
ml-kem = { version = "0.3.2", optional = true, features = ["getrandom"] }
ml-dsa = { version = "0.1.1", optional = true, features = ["getrandom"] }

[features]
default = []
pqc-native = ["dep:ml-kem", "dep:ml-dsa"]
hsm-pkcs11 = []
tpm2-native = []
ebpf-aya = []
