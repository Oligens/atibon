[package]
name = "atibon-core"
version = "3.0.0"
edition = "2021"
description = "ATIBON sovereign defensive firewall core"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[features]
default = []
pqc-native = []
hsm-pkcs11 = []
tpm2-native = []
